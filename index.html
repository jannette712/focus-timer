<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0a08">
<title>Focus Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0805;
    --surface: #1a1410;
    --border: #2e2318;
    --crimson: #9b2335;
    --crimson-glow: rgba(155, 35, 53, 0.28);
    --water: #3a8c8c;
    --water-glow: rgba(58, 140, 140, 0.25);
    --done: #7db87a;
    --done-glow: rgba(125, 184, 122, 0.22);
    --text: #ede0cc;
    --muted: #6b5e52;
    --accent: #ecbf6c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cormorant Garamond', serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Grain texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 128px 128px;
  }

  /* Vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.6) 100%);
  }

  .app {
    width: 100%;
    max-width: 420px;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    position: relative;
    z-index: 1;
  }

  .header { text-align: center; }
  .header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 25px;
    font-weight: 500;
    font-style: italic;
    letter-spacing: 0.08em;
    color: var(--accent);
  }
  .session-label {
    font-family: 'Noto Sans', sans-serif;
    font-size: 10px;
    font-weight: 300;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.14em;
    transition: color 0.3s;
  }

  /* Ring */
  .ring-container {
    position: relative;
    width: 240px; height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ring-svg {
    position: absolute;
    top: 0; left: 0;
    transform: rotate(-90deg);
    width: 100%; height: 100%;
  }
  .ring-bg { fill: none; stroke: var(--border); stroke-width: 1.5; }
  .ring-progress {
    fill: none;
    stroke: var(--crimson);
    stroke-width: 1.5;
    stroke-linecap: butt;
    transition: stroke-dashoffset 1s linear, stroke 0.8s ease;
    filter: drop-shadow(0 0 5px var(--crimson-glow));
  }
  .ring-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .time-display {
    font-family: "Noto Sans", sans-serif;
    font-size: 52px;
    font-weight: 300;
    letter-spacing: -2px;
    line-height: 1;
    transition: color 0.3s;
  }
  .time-phase {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-style: italic;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* Divider */
  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--border);
    margin-top: -14px;
    margin-bottom: -14px;
  }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider-mark { font-size: 8px; color: var(--muted); line-height: 1; }

  /* Time counter */
  .time-counter-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .time-count-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 38px;
    font-weight: 300;
    color: var(--crimson);
    transition: color 0.3s;
    line-height: 1;
  }
  .time-count-label {
    font-family: 'Noto Sans', sans-serif;
    font-size: 9px;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.18em;
  }
  .next-break-badge {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    font-style: italic;
    color: var(--muted);
    margin-top: 2px;
  }
  .next-break-badge span { color: var(--text); }

  /* Controls */
  .controls {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .btn {
    border: none;
    cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn:active { transform: scale(0.94); }
  .btn-main {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--crimson);
    color: var(--text);
    font-size: 24px;
    border: 1px solid rgba(155, 35, 53, 0.4);
    box-shadow: 0 0 24px var(--crimson-glow), 0 4px 16px rgba(0,0,0,0.5);
  }
  .btn-main:hover { box-shadow: 0 0 36px var(--crimson-glow), 0 4px 20px rgba(0,0,0,0.6); }
  .btn-secondary {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    font-size: 18px;
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { color: var(--text); border-color: var(--muted); }

  /* Settings */
  .settings-row {
    display: flex;
    gap: 12px;
    width: 100%;
  }
  .setting-chip {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .setting-chip label {
    font-family: 'Noto Sans', sans-serif;
    font-size: 11px;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.14em;
  }
  .setting-chip input {
    background: none;
    border: none;
    color: var(--text);
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 400;
    width: 100%;
    outline: none;
    -moz-appearance: textfield;
  }
  .setting-chip input::-webkit-outer-spin-button,
  .setting-chip input::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* Toast */
  .toast {
    position: fixed;
    top: 24px; left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 18px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-style: italic;
    letter-spacing: 0.04em;
    color: var(--text);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
    white-space: nowrap;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Flash */
  .flash {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 50;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .flash.water { background: radial-gradient(ellipse at center, rgba(58,140,140,0.12), transparent 70%); }
  .flash.done  { background: radial-gradient(ellipse at center, rgba(125,184,122,0.12), transparent 70%); }
  .flash.start { background: radial-gradient(ellipse at center, rgba(155,35,53,0.10), transparent 70%); }
  .flash.eyes  { background: radial-gradient(ellipse at center, rgba(237,224,204,0.08), transparent 70%); }
  .flash.show  { opacity: 1; }

  .completed .time-display { color: var(--done); }
  .completed .ring-progress { stroke: var(--done); filter: drop-shadow(0 0 8px var(--done-glow)); }
</style>
</head>
<body>

<div class="flash" id="flash"></div>
<div class="toast" id="toast"></div>

<div class="app" id="app">
  <div class="header">
    <h1>Focus Timer</h1>
    <div class="session-label" id="sessionLabel">ready to start</div>
  </div>

  <div class="ring-container">
    <svg class="ring-svg" viewBox="0 0 240 240">
      <circle class="ring-bg" cx="120" cy="120" r="108"/>
      <circle class="ring-progress" id="ringProgress" cx="120" cy="120" r="108"
        stroke-dasharray="678.6" stroke-dashoffset="0"/>
    </svg>
    <div class="ring-center">
      <div class="time-display" id="timeDisplay">45:00</div>
      <div class="time-phase" id="timePhase">Focus</div>
    </div>
  </div>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-mark">◆</div>
    <div class="divider-line"></div>
  </div>

  <!-- Session counter -->
  <div class="time-counter-row">
    <div class="time-count-number" id="sessionCountNumber">0</div>
    <div class="time-count-label">Time worked today</div>
    <div class="next-break-badge" id="nextBreakBadge">next: <span>short break</span></div>
  </div>

  <div class="controls">
    <button class="btn btn-secondary" id="btnReset" title="Reset">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74"/>
        <path d="M3 3v5h5"/>
      </svg>
    </button>
    <button class="btn btn-main" id="btnPlay" title="Start">
      <svg id="iconPlay" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="currentColor">
        <polygon points="9,5 23,14 9,23"/>
      </svg>
      <svg id="iconPause" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="currentColor" style="display:none">
        <rect x="7" y="5" width="5" height="18" rx="2"/>
        <rect x="16" y="5" width="5" height="18" rx="2"/>
      </svg>
    </button>
    <button class="btn btn-secondary" id="btnSkip" title="Skip">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 4 15 12 5 20" fill="currentColor" stroke="none"/>
        <line x1="19" y1="4" x2="19" y2="20"/>
      </svg>
    </button>
  </div>

  <div class="settings-row">
    <div class="setting-chip">
      <label>Focus (min)</label>
      <input type="number" id="workMin" value="45" min="1" max="120">
    </div>
    <div class="setting-chip">
      <label>Short Break</label>
      <input type="number" id="shortBreakMin" value="10" min="1" max="30">
    </div>
    <div class="setting-chip">
      <label>Long Break</label>
      <input type="number" id="longBreakMin" value="20" min="1" max="60">
    </div>
    <div class="setting-chip">
      <label>Water <span style="font-size: 9px;">(every X mins)</span></label>
      <input type="number" id="waterMin" value="10" min="1" max="30">
    </div>
  </div>
</div>

<script>
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// --- Sounds ---
function playStartSound() {
  const ctx = getAudioCtx(), t = ctx.currentTime;
  [523.25, 659.25].forEach((freq, i) => {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t + i * 0.18);
    gain.gain.setValueAtTime(0, t + i * 0.18);
    gain.gain.linearRampToValueAtTime(0.25, t + i * 0.18 + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.18 + 0.5);
    osc.start(t + i * 0.18); osc.stop(t + i * 0.18 + 0.55);
  });
}

function playEndSound() {
  const ctx = getAudioCtx(), t = ctx.currentTime;
  [880, 698.46, 523.25].forEach((freq, i) => {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t + i * 0.22);
    gain.gain.setValueAtTime(0, t + i * 0.22);
    gain.gain.linearRampToValueAtTime(0.3, t + i * 0.22 + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.22 + 0.7);
    osc.start(t + i * 0.22); osc.stop(t + i * 0.22 + 0.75);
  });
}

function playWaterSound() {
  const ctx = getAudioCtx(), t = ctx.currentTime;
  [1046.5, 1318.5].forEach((freq, i) => {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t + i * 0.1);
    osc.frequency.linearRampToValueAtTime(freq * 1.05, t + i * 0.1 + 0.12);
    gain.gain.setValueAtTime(0, t + i * 0.1);
    gain.gain.linearRampToValueAtTime(0.18, t + i * 0.1 + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.35);
    osc.start(t + i * 0.1); osc.stop(t + i * 0.1 + 0.4);
  });
}

function playEyeSound() {
  const ctx = getAudioCtx(), t = ctx.currentTime;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(1174.66, t);
  osc.frequency.linearRampToValueAtTime(1108.73, t + 0.4);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.15, t + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
  osc.start(t); osc.stop(t + 1);
}

// --- Icon helpers ---
const iconPlay  = document.getElementById('iconPlay');
const iconPause = document.getElementById('iconPause');
function showPlayIcon()  { iconPlay.style.display=''; iconPause.style.display='none'; }
function showPauseIcon() { iconPlay.style.display='none'; iconPause.style.display=''; }

// --- State ---
let state = {
  running: false,
  phase: 'work',       // 'work' | 'short-break' | 'long-break'
  remaining: 0,
  totalTime: 0,
  waterInterval: 0,
  interval: null,
  sessions: 0,         // completed work sessions today
  workBlocks: 0,       // raw work blocks completed (internal)
  workedSecs: 0,       // total seconds of work completed today
};

// --- DOM ---
const timeDisplay       = document.getElementById('timeDisplay');
const timePhase         = document.getElementById('timePhase');
const ring              = document.getElementById('ringProgress');
const btnPlay           = document.getElementById('btnPlay');
const btnReset          = document.getElementById('btnReset');
const btnSkip           = document.getElementById('btnSkip');
const workInput         = document.getElementById('workMin');
const shortBreakInput   = document.getElementById('shortBreakMin');
const longBreakInput    = document.getElementById('longBreakMin');
const waterInput        = document.getElementById('waterMin');
const sessionCountEl    = document.getElementById('sessionCountNumber');
const nextBreakBadge    = document.getElementById('nextBreakBadge');
const sessionLabel      = document.getElementById('sessionLabel');
const toast             = document.getElementById('toast');
const flash             = document.getElementById('flash');
const app               = document.getElementById('app');

const CIRCUMFERENCE = 2 * Math.PI * 108;

function fmt(secs) {
  return `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
}

let toastTimer = null;
function showToast(msg, color) {
  toast.textContent = msg;
  toast.style.color = color || 'var(--text)';
  toast.style.borderColor = color || 'var(--border)';
  toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
}

function flashScreen(type) {
  flash.className = `flash ${type}`;
  flash.style.opacity = '1';
  setTimeout(() => { flash.style.opacity = '0'; }, 400);
}

// --- Break logic ---
// After odd sessions (1, 3, 5…) → short break
// After even sessions (2, 4, 6…) → long break
function nextBreakType() {
  return state.workBlocks % 2 === 0 ? 'short-break' : 'long-break';
}

function nextBreakLabel() {
  return state.workBlocks % 2 === 0 ? 'short break' : 'long break';
}

function fmtWorked(secs) {
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function updateSessionCounter() {
  sessionCountEl.textContent = fmtWorked(state.workedSecs);
  if (state.phase === 'work') {
    nextBreakBadge.style.display = '';
    nextBreakBadge.innerHTML = `next: <span>${nextBreakLabel()}</span>`;
  } else {
    nextBreakBadge.style.display = 'none';
  }
}

function updateRing() {
  const offset = CIRCUMFERENCE * (1 - state.remaining / state.totalTime);
  ring.style.strokeDashoffset = offset;
}

function setPhaseColors(phase) {
  if (phase === 'short-break' || phase === 'long-break') {
    ring.style.stroke = 'var(--water)';
    ring.style.filter = 'drop-shadow(0 0 6px var(--water-glow))';
    sessionCountEl.style.color = 'var(--water)';
  } else if (phase === 'done') {
    ring.style.stroke = 'var(--done)';
    ring.style.filter = 'drop-shadow(0 0 8px var(--done-glow))';
    sessionCountEl.style.color = 'var(--done)';
  } else {
    ring.style.stroke = 'var(--crimson)';
    ring.style.filter = 'drop-shadow(0 0 6px var(--crimson-glow))';
    sessionCountEl.style.color = 'var(--crimson)';
  }
}

function getBreakSecs(breakType) {
  if (breakType === 'long-break') return (parseInt(longBreakInput.value) || 20) * 60;
  return (parseInt(shortBreakInput.value) || 10) * 60;
}

function phaseLabel(phase) {
  if (phase === 'short-break') return 'Short break';
  if (phase === 'long-break')  return 'Long break';
  return 'Focus';
}

function initTimer(phase) {
  const workSecs  = (parseInt(workInput.value) || 45) * 60;
  const waterSecs = (parseInt(waterInput.value) || 10) * 60;

  state.phase = phase;
  state.totalTime = phase === 'work' ? workSecs : getBreakSecs(phase);
  state.remaining = state.totalTime;
  state.waterInterval = waterSecs;
  updateRing();
  timeDisplay.textContent = fmt(state.remaining);
  timeDisplay.style.color = '';
  timePhase.textContent = phaseLabel(phase);
  setPhaseColors(phase);
  app.classList.remove('completed');
  updateSessionCounter();
}

function startTimer() {
  if (state.interval) clearInterval(state.interval);
  state.running = true;
  showPauseIcon();
  playStartSound();
  flashScreen('start');
  if (state.phase === 'work') {
    sessionLabel.textContent = `session ${state.sessions + 1} · focus`;
  } else {
    sessionLabel.textContent = `session ${state.sessions} · ${phaseLabel(state.phase)}`;
  }
  state.interval = setInterval(tick, 1000);
}

function pauseTimer() {
  clearInterval(state.interval);
  state.running = false;
  showPlayIcon();
  sessionLabel.textContent = 'paused';
}

function tick() {
  state.remaining--;

  // Eye rest at halfway
   // Eye rest every 20 minutes elapsed (fires at 20min, 40min, 60min… into the session)
  const EYE_INTERVAL = 20 * 60;
  const elapsed = state.totalTime - state.remaining;
  if (state.phase === 'work' && elapsed > 0 && elapsed % EYE_INTERVAL === 0) {
    playEyeSound();
    flashScreen('eyes');
    showToast('👁 rest your eyes — look 20ft away', 'var(--water)');
  }

  // Water reminder (work only)
  if (state.phase === 'work' && state.remaining > 0 && state.remaining % state.waterInterval === 0) {
    playWaterSound();
    flashScreen('water');
    showToast('💧 sip of water!', 'var(--water)');
  }

  updateRing();
  timeDisplay.textContent = fmt(state.remaining);

  if (state.remaining <= 0) {
    clearInterval(state.interval);
    state.running = false;
    playEndSound();

    if (state.phase === 'work') {
      state.workBlocks++;
      state.sessions = Math.floor(state.workBlocks / 2);
      state.workedSecs += state.totalTime;
      saveSessions();
      updateSessionCounter();
      flashScreen('done');
      app.classList.add('completed');
      timePhase.textContent = 'done!';
      timeDisplay.style.color = 'var(--done)';
      setPhaseColors('done');
      sessionLabel.textContent = `session ${state.sessions} complete ✓`;
      showPlayIcon();

      const upcomingBreak = nextBreakType(); // capture before timeout
      const breakMsg = upcomingBreak === 'long-break'
        ? '🎉 session complete! long break earned.'
        : '🎉 session complete! short break time.';
      showToast(breakMsg, 'var(--done)');

      setTimeout(() => {
        initTimer(upcomingBreak);
        sessionLabel.textContent = `${phaseLabel(upcomingBreak)} — press play`;
        showPlayIcon();
      }, 3000);

    } else {
      // break ended
      initTimer('work');
      sessionLabel.textContent = 'break done — press play';
      showPlayIcon();
      showToast('✦ break over — ready to focus', 'var(--crimson)');
    }
  }
}

// --- Session persistence (resets at midnight) ---
function todayKey() {
  const d = new Date();
  return `focus_sessions_${d.getFullYear()}_${d.getMonth()}_${d.getDate()}`;
}
function loadSessions() {
  try {
    const v = localStorage.getItem(todayKey());
    return v ? JSON.parse(v) : { workBlocks: 0, workedSecs: 0 };
  } catch(e) { return { workBlocks: 0, workedSecs: 0 }; }
}
function saveSessions() {
  try {
    localStorage.setItem(todayKey(), JSON.stringify({
      workBlocks: state.workBlocks,
      workedSecs: state.workedSecs
    }));
  } catch(e) {}
}

// --- Wake Lock ---
let wakeLock = null;
let wakeLockHeartbeat = null;

async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    if (wakeLock) { try { await wakeLock.release(); } catch(e) {} }
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch(e) {}
}
async function releaseWakeLock() {
  stopWakeLockHeartbeat();
  if (wakeLock) { try { await wakeLock.release(); } catch(e) {} wakeLock = null; }
}
function startWakeLockHeartbeat() {
  stopWakeLockHeartbeat();
  wakeLockHeartbeat = setInterval(async () => {
    if (state.running) await requestWakeLock();
  }, 25000);
}
function stopWakeLockHeartbeat() {
  if (wakeLockHeartbeat) { clearInterval(wakeLockHeartbeat); wakeLockHeartbeat = null; }
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && state.running) await requestWakeLock();
});

// --- Button handlers ---
btnPlay.addEventListener('click', async () => {
  getAudioCtx();
  if (state.running) {
    pauseTimer();
    await releaseWakeLock();
    stopWakeLockHeartbeat();
  } else {
    startTimer();
    await requestWakeLock();
    startWakeLockHeartbeat();
  }
});

btnReset.addEventListener('click', async () => {
  clearInterval(state.interval);
  state.running = false;
  await releaseWakeLock();
  initTimer('work');
  showPlayIcon();
  sessionLabel.textContent = 'ready to start';
});

btnSkip.addEventListener('click', async () => {
  clearInterval(state.interval);
  state.running = false;
  await releaseWakeLock();
  if (state.phase === 'work') {
    const breakType = nextBreakType();
    state.workBlocks++;
    state.sessions = Math.floor(state.workBlocks / 2);
    state.workedSecs += state.remaining; // count whatever was left
    saveSessions();
    initTimer(breakType);
    sessionLabel.textContent = `${phaseLabel(breakType)} — press play`;
  } else {
    initTimer('work');
    sessionLabel.textContent = 'press play to focus';
  }
  showPlayIcon();
});

[workInput, shortBreakInput, longBreakInput, waterInput].forEach(inp => {
  inp.addEventListener('change', () => { if (!state.running) initTimer(state.phase); });
});

// --- Init ---
const saved = loadSessions();
state.workBlocks = saved.workBlocks;
state.workedSecs = saved.workedSecs;
state.sessions   = Math.floor(state.workBlocks / 2);
initTimer('work');
</script>
</body>
